[workspace]
members = ["crates/recon-domain", "crates/recon-import"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/akira-shirase-oss/accounting-reconciliation"
publish = false

[workspace.dependencies]
recon-domain = { path = "crates/recon-domain" }
recon-import = { path = "crates/recon-import" }
recon-db = { path = "crates/recon-db" }
recon-cli = { path = "crates/recon-cli" }

# External crates: versions live here only. Minimal features; one async runtime (Tokio);
# one TLS stack (rustls with ring and the webpki roots, so `sslmode=require` and
# `verify-full` URLs such as Neon's work without a system OpenSSL).
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
hex = "0.4.3"
http-body-util = "0.1.5"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "uuid", "time", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7.20", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace", "timeout", "limit", "catch-panic", "sensitive-headers"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29", features = ["serde"] }
# Test and load-driver HTTP client only (dev-dependencies and perf/loadgen); the
# architecture check keeps it out of every production crate.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "deny"

[profile.release]
debug = "line-tables-only"

# Property tests and the generator are hot in debug test builds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.proptest]
opt-level = 3
