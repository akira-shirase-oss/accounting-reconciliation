name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily: new advisories appear without any code change.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (scripts/check.sh against the compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same compose file, image digest and TLS settings as local development.
      - name: Start PostgreSQL (deploy/compose.yaml)
        run: scripts/stack.sh up
      - name: The gate (toolchain, fmt, clippy, architecture, tests, drills)
        run: |
          eval "$(scripts/stack.sh env)"
          scripts/check.sh
      - name: Load smoke (short run; full runs are local, committed under perf/results/)
        if: hashFiles('scripts/load.sh') != ''
        run: |
          eval "$(scripts/stack.sh env)"
          MODE=smoke scripts/load.sh r0-import
          MODE=smoke scripts/load.sh r1-import

  load-full:
    # The full runs (1,000,000 lines each) on a fresh runner: on demand, or when a commit
    # message carries [load-full]. Its JSON is printed for committing under
    # perf/results/ (machine, commit and load average are inside it).
    name: load (full, 1,000,000 lines; r0-import and r1-import)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[load-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start PostgreSQL (deploy/compose.yaml)
        run: scripts/stack.sh up
      - name: Full run, r0-import
        run: |
          eval "$(scripts/stack.sh env)"
          MODE=full scripts/load.sh r0-import
      - name: Full run, r1-import (overlapping files, D-067)
        run: |
          eval "$(scripts/stack.sh env)"
          MODE=full scripts/load.sh r1-import

  production:
    # The production path (D-069): release build, recon.env from its template, the server
    # as the systemd unit runs it (and systemd-analyze on the unit), a first import, verify
    # and anchor, backup and restore verified against the anchors, an upgrade, the Caddy
    # reverse proxy with its access log checked.
    name: production path (release, service, proxy, backup and restore)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start PostgreSQL (deploy/compose.yaml)
        run: scripts/stack.sh up
      - name: The production path
        run: |
          eval "$(scripts/stack.sh env)"
          scripts/production-smoke.sh

  fuzz:
    # Failure case 6 (D-066): every cargo-fuzz target, 60 s each, on the pinned nightly.
    # A crash leaves its input under fuzz/artifacts/, uploaded for a fixture.
    name: fuzz (every parser, 60 s each)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-09-06 --profile minimal
          (cd "$RUNNER_TEMP" && cargo install cargo-fuzz --version 0.13.2 --locked)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
      - name: Fuzz every parser
        run: FUZZ_SECONDS=60 scripts/fuzz.sh
      - name: Keep a crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
