name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new advisories appear without any code change.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (scripts/check.sh against the compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same compose file, image digest and TLS settings as local development.
      - name: Start PostgreSQL (deploy/compose.yaml)
        run: scripts/stack.sh up
      - name: The gate (toolchain, fmt, clippy, architecture, tests, drills)
        run: |
          eval "$(scripts/stack.sh env)"
          scripts/check.sh
      - name: Load smoke (short run; full runs are local, committed under perf/results/)
        if: hashFiles('scripts/load.sh') != ''
        run: |
          eval "$(scripts/stack.sh env)"
          MODE=smoke scripts/load.sh r0-import

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
