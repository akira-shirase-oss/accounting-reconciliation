[package]
name = "recon-server"
description = "The Accounting Reconciliation API server: bounded streaming imports through staging, readiness, one error envelope."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Pause points for the kill drills (tests/drills.rs). Never in a release build.
fault-injection = []

[[bin]]
name = "recon-server"
path = "src/main.rs"

# The process-kill drills need the pause points compiled into the binary they spawn.
[[test]]
name = "drills"
required-features = ["fault-injection"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
recon-db.workspace = true
recon-domain.workspace = true
recon-import.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
recon-cli.workspace = true
recon-db = { workspace = true, features = ["test-support"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
tokio-stream.workspace = true

[lints]
workspace = true
