[package]
name = "recon-db"
description = "PostgreSQL storage for Accounting Reconciliation: migrations, roles, firm-scoped repositories, staged imports and the hash-chained decision log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TestDb: one throwaway, migrated database per test, created from RECON_TEST_ADMIN_URL.
test-support = []

[dependencies]
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
recon-domain.workspace = true
recon-import.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
recon-db = { path = ".", features = ["test-support"] }
tokio.workspace = true

[lints]
workspace = true
